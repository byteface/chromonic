[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "chromonic"
version = "0.0.1"
description = "Experimental POC: domonic DOM/CSSOM backed browser"
requires-python = ">=3.10"
dependencies = [
    "domonic>=1.8.1",
    "fonttools[woff]>=4.0",
    "glfw>=2.7",
    "myjs",
    "PyOpenGL>=3.1",
    "pytest>=8.0",
    "skia-python>=87.0",
]

[tool.maturin]
# The compiled extension lands at chromonic/_native.*.so; python/chromonic/ is the
# pure-Python package (tree walking, the style bridge, the Skia painter).
module-name = "chromonic._native"
python-source = "python"
features = ["pyo3/extension-module"]
