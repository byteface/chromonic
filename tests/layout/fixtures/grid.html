<!doctype html><html><head><style>
html,body{margin:0} #grid{display:grid;width:600px;height:300px;grid-template-columns:100px 2fr 1fr;grid-template-rows:80px 1fr;gap:10px}
#a{grid-column:1;grid-row:1;background:#89b4fa} #b{grid-column:2/4;grid-row:1;background:#a6e3a1} #c{grid-column:1/3;grid-row:2;background:#f9e2af}
</style></head><body><div data-layout id="grid"><div data-layout id="a"></div><div data-layout id="b"></div><div data-layout id="c"></div></div></body></html>
