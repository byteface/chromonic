[package]
name = "chromonic_native"
version = "0.0.5"
edition = "2021"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
parley = "0.11.1"
pyo3 = { version = "0.29.2", features = ["extension-module"] }
taffy = "0.14.0"

# Taffy with chromonic's spec fixes (each marked "chromonic patch" in the
# source); see vendor/taffy/CHROMONIC_PATCHES.md.
[patch.crates-io]
taffy = { path = "vendor/taffy" }
